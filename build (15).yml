name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # permet de le lancer à la main depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilation
        run: mvn -B clean package

      - name: Envoi du jar (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: IvalonaBVN
          path: target/IvalonaBVN-*.jar
          if-no-files-found: error

  release:
    # Crée une release GitHub avec le jar quand on pousse un tag (ex. v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Téléchargement du jar
        uses: actions/download-artifact@v4
        with:
          name: IvalonaBVN

      - name: Création de la release
        uses: softprops/action-gh-release@v2
        with:
          files: IvalonaBVN-*.jar
          generate_release_notes: true
