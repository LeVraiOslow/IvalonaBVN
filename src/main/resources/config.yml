# ==========================================================
#  IvalonaBVN - configuration
#  Les messages utilisent le format MiniMessage :
#  https://docs.advntr.dev/minimessage/format.html
#  Variables : %player% (le nouveau joueur), %seconds%, %reward%
# ==========================================================

# Temps (en secondes) pendant lequel /bvn est utilisable après l'arrivée d'un nouveau joueur
duration-seconds: 20

# Récompense versée via Vault à chaque joueur qui souhaite la bienvenue (0 = aucune)
reward: 100.0

# Si le nouveau joueur se déconnecte, l'accueil est annulé
cancel-if-newcomer-leaves: true

messages:
  # Envoyé à tous les autres joueurs connectés quand un nouveau joueur arrive
  announce: '<gold>✦ <yellow>%player%</yellow> <gray>vient de rejoindre Ivalona pour la première fois ! Fais <click:run_command:/bvn><hover:show_text:"<green>Cliquer pour souhaiter la bienvenue"><green><bold>/bvn</bold></hover></click> <gray>dans les <white>%seconds%</white> secondes pour l''accueillir et gagner une récompense.'
  # Affiché dans le chat pour tout le monde quand quelqu'un fait /bvn
  welcome: '<green>Bienvenue <yellow>%player%</yellow> sur Ivalona !'
  # Envoyé au joueur qui reçoit sa récompense
  reward: '<gray>Merci pour ton accueil ! Tu as reçu <gold>%reward%</gold><gray>.'
  already: '<red>Tu as déjà souhaité la bienvenue à ce joueur.'
  nobody: '<red>Il n''y a personne à accueillir pour le moment.'
  self: '<red>Tu ne peux pas te souhaiter la bienvenue à toi-même !'
  economy-error: '<red>Une erreur est survenue lors du versement de la récompense. Préviens un membre du staff.'
  players-only: '<red>Cette commande est réservée aux joueurs.'
  no-permission: '<red>Tu n''as pas la permission de faire cela.'
  reloaded: '<green>Configuration rechargée.'
